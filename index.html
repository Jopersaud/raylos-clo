button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--brindle);outline-offset:3px;border-radius:4px}
img{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--head);font-weight:400;letter-spacing:normal;margin:0}
h1{font-size:56px;line-height:1.1}
h2{font-size:42px;line-height:1.1;margin-bottom:12px}
h3{font-size:30px;line-height:1.15;margin-bottom:6px}
.hello-text{font-size:76px;line-height:1;margin:0 0 6px}

/* top bar: icon only */
.topbar{display:flex;align-items:center;justify-content:center;height:var(--topbar-h);padding:0 20px;position:relative}
.mockbadge{position:absolute;right:20px;top:50%;transform:translateY(-50%);border:1.5px solid var(--brindle);border-radius:999px;padding:2px 14px;font-size:14px;background:var(--white)}
.topbar a,.topbar .logo{display:flex;align-items:center;text-decoration:none}
.topbar .cat{height:46px;width:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brindle);color:var(--bone);border:2px solid var(--brindle);border-radius:999px;padding:8px 20px;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--brindle-dark);border-color:var(--brindle-dark)}
.btn.secondary{background:transparent;color:var(--brindle)}
.btn.secondary:hover{background:var(--white)}
.btn.small{padding:3px 14px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{font-size:16px;text-decoration:underline;text-underline-offset:3px}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:flex;flex-direction:column}
.login-body{flex:1;display:grid;grid-template-columns:1.1fr 1fr;align-items:center}
.login-art{display:flex;align-items:center;justify-content:center;padding:1vh 3vw 4vh}
.login-art img{max-height:58vh;max-width:78%;width:auto;height:auto}
.login-panel{padding:1vh 6vw 4vh 2vw;max-width:640px}
.login-word{height:64px;width:auto;margin:0 0 22px}
.login-panel .sub{margin:0 0 30px;font-size:20px}
.field{margin-bottom:26px}
.field label{display:block;font-size:17px;margin-bottom:2px}
.field input{width:100%;font:inherit;letter-spacing:inherit;font-size:21px;color:var(--brindle);background:transparent;border:0;border-bottom:2px solid var(--brindle);border-radius:0;padding:8px 0;outline:none}
.field input::placeholder{color:#8A8074}
.field input:focus{border-bottom-width:3px}
.field input:focus-visible{outline:none}
.row-links{display:flex;justify-content:flex-end;margin:-12px 0 20px}
.go{font-size:26px;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px;margin-top:6px}
.error{min-height:26px;margin:0 0 6px;font-size:16px;font-weight:700}
.note{margin:22px 0 0;font-size:16px}
.login-foot{margin-top:34px;font-size:16px}

/* ---------- APP SHELL (tabs across the top) ---------- */
.k{font-family:var(--head);letter-spacing:normal}
#app{min-height:100vh}
.apphead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 40px 0}
.apphead .ah-left{display:flex;gap:12px;align-items:center;font-size:15px;flex-wrap:wrap}
.apphead .ah-left .mockbadge{position:static;transform:none}
.apphead .ah-logo img{height:50px;width:auto}
.apphead .ah-right{display:flex;justify-content:flex-end}
.apphead .ah-right button{font-family:var(--head);font-size:30px;letter-spacing:normal;text-decoration:underline;text-underline-offset:4px}
.nav{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;padding:2px 24px 0;border-bottom:1px solid var(--line)}
.nav button{font-family:var(--head);font-size:38px;line-height:1.1;letter-spacing:normal;padding:2px 4px 8px;border-bottom:4px solid transparent;white-space:nowrap}
.amp{font-family:var(--body);font-size:.6em;letter-spacing:.023em}
.nav button:hover{border-bottom-color:var(--line)}
.nav button[aria-current="page"]{border-bottom-color:var(--olive)}
.main{max-width:1380px;margin:0 auto;padding:26px 48px 30px;min-width:0}
.foot{text-align:center;font-size:30px;padding:6px 0 34px}

/* ---------- bento dashboard ---------- */
.hero{margin:4px 0 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hero h1.hello-text{font-size:104px;line-height:1;margin:0}
.hero p{font-size:20px;margin-top:6px}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(215px,auto);gap:20px}
.tile{border-radius:26px;padding:22px 24px;position:relative;overflow:hidden;border:2px solid var(--brindle);background:var(--white);min-width:0}
.tile .big{font-family:var(--body);font-weight:700;letter-spacing:0;font-size:76px;line-height:1;margin:8px 0 6px}
.tile p{font-size:16px}
.tile .btn.secondary{background:var(--white)}
.tile.ship{grid-column:1/3;grid-row:1/3;background:var(--lilac)}
.tile.ship .big{font-size:124px}
.tile.ship ul{list-style:none;padding:0;margin:8px 0 14px;display:grid;gap:8px}
.tile.ship li{display:flex;align-items:center;gap:12px;background:var(--white);border-radius:14px;padding:6px 14px;font-size:17px}
.tile.ship li img:not(.th){width:34px;height:34px;flex:none}
.tile.ship li b{margin-left:auto;white-space:nowrap;padding-left:8px}
.tile.ship .nice{font-size:20px;margin:8px 0 16px}
.tile.ship .more{margin:-6px 0 12px}
.tile.collect{background:var(--sage)}
.tile.sold::after{content:"";position:absolute;right:-40px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:var(--fawn);opacity:.55}
.tile.sold p{position:relative;z-index:1}
.tile.chartt{grid-column:3/5}
.tile.today{grid-column:1/3}
.tile.rack{background:var(--bone);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.tile.rack img{height:128px;width:auto}
.tile.rack .k{font-size:28px;line-height:1.15}
.tile .todo{display:grid;grid-template-columns:1fr 1fr;column-gap:26px;margin-top:6px}
.tile .todo li{padding:7px 0}
.tile .addrow{margin-top:10px}
.mbars{display:flex;align-items:flex-end;gap:18px;height:118px;margin-top:12px;border-bottom:2px solid var(--brindle)}
.mbars>div{flex:1;display:flex;gap:5px;align-items:flex-end;justify-content:center;height:100%}
.mbars i{display:block;width:26px;max-width:40%;border:2px solid var(--brindle);border-radius:6px 6px 0 0;background:var(--sage);min-height:2px}
.mbars i.p{background:var(--olive)}
.mmonths{display:flex;gap:18px;margin-top:4px;font-size:14px}.mmonths span{flex:1;text-align:center}
.anim .mbars i{transform-origin:bottom;animation:growY .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.anim .hbar{transform-origin:left;animation:growX .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.tile .bars{margin-top:10px}
.tile .bar-row .meta{font-size:15px}

/* ---------- pipeline board ---------- */
.boardscroll{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(5,minmax(228px,1fr));gap:14px;align-items:stretch;min-width:1180px;height:clamp(460px,calc(100vh - 380px),780px)}
.bcol{background:#F0EBDB;border-radius:22px;padding:0;border:2px solid transparent;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0}
.bcol::after{content:"";position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(rgba(240,235,219,0),#F0EBDB);pointer-events:none}
.bbody{padding:10px 10px 28px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:var(--brindle) transparent}
.bbody::-webkit-scrollbar{width:8px}.bbody::-webkit-scrollbar-thumb{background:var(--brindle);border-radius:8px}
.bcol.over{border:2px dashed var(--brindle)}
.bcol h3{font-size:34px;line-height:1.1;padding:6px 12px 8px;margin:0;border-radius:20px 20px 0 0;flex:none;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--brindle)}
.bcol h3 span{font-family:var(--body);font-size:16px;font-weight:700;letter-spacing:.023em}
.bcol.c1 h3,.bcol.c5 h3{background:var(--bone)}.bcol.c2 h3,.bcol.c4 h3{background:var(--sage)}.bcol.c3 h3{background:var(--lilac)}
.bcard{background:var(--white);border:1.5px solid var(--brindle);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.bcard[draggable="true"]{cursor:grab}
.bcard.dragging{opacity:.4}
.bcard .r1{display:flex;gap:10px;align-items:center;cursor:pointer}
.bcard .r1 img{width:30px;height:30px;flex:none}
.bcard .t{font-weight:700;font-size:15px;line-height:1.25;flex:1}
.bcard .m{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:14px;gap:6px}
.pl{display:inline-block;border:1.5px solid var(--brindle);border-radius:999px;padding:0 9px;font-size:13px;background:var(--white);margin:0 4px 2px 0;white-space:nowrap}
.bcard .also{font-size:13px;margin-top:4px}
.bcard .bact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bcol .none{font-size:14px;padding:6px 8px;margin:0}
.boardfoot,.boardhint{font-size:15px;margin:8px 0 0}
.boardmsg{min-height:22px;font-size:15px;font-weight:700;margin:8px 0 0}
.tablecard{background:var(--white);border:2px solid var(--brindle);border-radius:26px;padding:20px 22px}
#itemsList .tablewrap{max-height:clamp(380px,calc(100vh - 400px),720px);overflow:auto}
#itemsList th{position:sticky;top:0;background:var(--white);z-index:2}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.top .date{margin:6px 0 0;font-size:19px}
.pill{display:inline-block;border:1.5px solid var(--brindle);border-radius:999px;padding:3px 14px;font-size:15px}
.lead{margin:0 0 18px;font-size:18px;max-width:760px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:22px}
.card{background:var(--white);border:2px solid var(--brindle);border-radius:26px;padding:22px 24px 22px;position:relative;overflow:hidden;margin-bottom:18px}
.stats .card,.grid2 .card{margin-bottom:0}
.card::before{content:"";position:absolute;right:-34px;top:-34px;width:96px;height:96px;border-radius:50%;background:var(--accent,var(--sage));opacity:.7;z-index:0}
.card>*{position:relative;z-index:1}
.stat .label{font-size:17px}
.stat .num{font-size:40px;line-height:1.1;margin:6px 0 2px;font-weight:700}
.stat .hint{font-size:15px}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-bottom:18px}
.grid2.lower{grid-template-columns:1.5fr 1fr}

.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.todo input[type=checkbox]{width:22px;height:22px;margin:3px 0 0;accent-color:var(--brindle);flex:none}
.todo .txt{flex:1}
.todo .done .txt{text-decoration:line-through}
.todo .x{font-size:20px;line-height:1;padding:2px 6px}
.addrow{display:flex;gap:10px;margin-top:12px}
.addrow input{flex:1;min-width:0}

input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{font:inherit;letter-spacing:inherit;color:var(--brindle);background:var(--white);border:1.5px solid var(--brindle);border-radius:10px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:84px}

.bars{display:flex;flex-direction:column;gap:14px}
.bar-row .meta{display:flex;justify-content:space-between;gap:10px;font-size:17px;margin-bottom:5px}
.bar-track{height:14px;background:var(--bone);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;border-radius:999px}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-weight:700;text-align:left;font-size:16px;padding:6px 10px 10px;border-bottom:2px solid var(--brindle);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
td .itemcell{display:flex;align-items:center;gap:12px}
td .itemcell img:not(.th){width:36px;height:36px;flex:none}
td .sub{font-size:14px}
tfoot td{font-weight:700;border-top:2px solid var(--brindle)}
.status{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--brindle);flex:none}
.chip{display:inline-block;border:1.5px solid var(--brindle);border-radius:999px;padding:0 10px;font-size:14px;margin:2px 4px 2px 0;background:var(--white);white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input[type=search]{max-width:340px}
.subtabs{display:flex;gap:8px;flex-wrap:wrap}
.subtabs button{padding:5px 16px;border-radius:999px;border:1.5px solid var(--brindle);font-size:16px;background:var(--white)}
.subtabs button[aria-pressed="true"]{background:var(--brindle);color:var(--bone);font-weight:700}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 10px}
.empty img{height:260px;width:auto;margin-bottom:16px}
.empty p{margin:0 0 8px;font-size:19px;max-width:560px}
.empty .small{font-size:16px}
.empty .btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px}

.pcard{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;background:var(--white)}
.pcard .head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.pcard .ttl{font-weight:700;font-size:18px}
.pcard .meta{font-size:15px}
.checks{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}
.checks label{display:flex;gap:8px;align-items:center;font-size:16px;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--brindle)}
.shiprow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.shiprow input{max-width:300px}
.msg{font-size:14px;min-height:20px;margin-top:3px}
.msg.warn,.msg.bad{font-weight:700}

.notes{list-style:none;margin:0;padding:0}
.notes li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.notes li:last-child{border-bottom:0}
.notes .body{flex:1;min-width:0}
.notes .from{font-weight:700}
.notes .when{font-size:14px}
.star{font-size:26px;line-height:1;padding:0 4px}
.notes .resp{font-size:15px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.form-grid .full{grid-column:1/-1}
.ff label{display:block;font-weight:700;font-size:15px;margin-bottom:4px}
.fees{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.btnrow2{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

dialog{border:0;border-radius:18px;padding:0;max-width:780px;width:calc(100% - 28px);background:var(--bone);color:var(--brindle);box-shadow:0 20px 60px rgba(60,50,40,.35);max-height:calc(100vh - 28px)}
dialog::backdrop{background:rgba(70,62,54,.45)}
.dlg{padding:24px 26px 22px}
.dlg h2{font-size:44px;margin-bottom:14px}
.dlg-actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.dlg-actions .spacer{flex:1}


/* ---------- charts ---------- */
.chart-sub{font-size:15px;margin:-4px 0 12px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 10px;font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:16px;height:16px;border:2px solid var(--brindle);border-radius:4px;display:inline-block;flex:none}
.chart-empty{margin:6px 0;font-size:17px}
.chartscroll{overflow-x:auto;padding-bottom:4px}
.c1-wrap{display:grid;grid-template-columns:54px 1fr;grid-template-rows:260px auto;padding-top:26px;min-width:440px}
.c1-y{position:relative}
.c1-y span{position:absolute;right:8px;transform:translateY(50%);font-size:13px}
.c1-plot{position:relative;display:flex;border-left:2px solid var(--brindle)}
.c1-plot .gl{position:absolute;left:0;right:0;height:0;border-top:1px dashed #CFC7B6}
.c1-plot .zl{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--brindle)}
.c1-col{flex:1;position:relative}
.c1-bar{position:absolute;border:2px solid var(--brindle);border-radius:6px 6px 0 0;min-height:3px}
.c1-bar.neg{border-radius:0 0 6px 6px}
.c1-bar.sales{left:14%;width:32%;background:var(--sage)}
.c1-bar.profit{left:54%;width:32%;background:var(--olive)}
.c1-val{position:absolute;font-size:13px;font-weight:700;transform:translateX(-50%);white-space:nowrap;line-height:1.1}
.c1-months{grid-column:2;display:flex;margin-top:8px}
.c1-months span{flex:1;text-align:center;font-size:15px}
.c2-pct{display:flex;height:24px;font-size:14px;font-weight:700}
.c2-pct span{text-align:center;white-space:nowrap;overflow:hidden}
.c2-bar{display:flex;height:58px;border:2px solid var(--brindle);border-radius:16px;overflow:hidden;background:var(--white)}
.c2-seg{height:100%;border-right:2px solid var(--brindle)}
.c2-seg:last-child{border-right:0}
.c2-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin-top:16px}
.c2-legend div{display:flex;align-items:center;gap:10px;font-size:16px}
.c2-legend b{margin-left:auto;padding-left:8px;white-space:nowrap}
.c2-note{font-size:19px;font-weight:700;margin:0 0 14px}
.hgroup{margin-bottom:6px}
.hrow{display:grid;grid-template-columns:minmax(90px,150px) 1fr minmax(96px,auto);gap:12px;align-items:center;padding:7px 0}
.hname{font-weight:700;line-height:1.25}
.hname small,.hval small{display:block;font-weight:400;font-size:13px}
.htrack{height:24px;border-left:2px solid var(--brindle)}
.hbar{height:100%;border:2px solid var(--brindle);border-left:0;border-radius:0 8px 8px 0;min-width:4px}
.hbar.loss{background-image:repeating-linear-gradient(45deg,var(--brindle) 0 3px,var(--white) 3px 8px)}
.hval{text-align:right;line-height:1.25}
.anim .c1-bar{animation:growY .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.anim .c1-bar.pos{transform-origin:bottom}
.anim .c1-bar.neg{transform-origin:top}
.anim .c1-val{animation:fadeIn .5s ease both;animation-delay:calc(var(--d,0s) + .6s)}
.anim .c2-bar{animation:reveal 1.1s cubic-bezier(.2,.8,.2,1) both}
.anim .c2-pct span{animation:fadeIn .5s ease both;animation-delay:.9s}
.anim .hbar{transform-origin:left;animation:growX .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0 round 16px)}to{clip-path:inset(0 0 0 0 round 16px)}}
@media (prefers-reduced-motion:reduce){.anim .c1-bar,.anim .c1-val,.anim .c2-bar,.anim .c2-pct span,.anim .hbar{animation:none}}


/* ---------- photos + frames ---------- */
.frame{display:block;border:2px solid var(--brindle);border-radius:14px;padding:5px;background:var(--bone);box-shadow:3px 4px 0 rgba(113,103,91,.18);cursor:pointer}
.frame img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;display:block;background:var(--white)}
.frame.noph{aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;text-align:center;line-height:1.2}
.frame.noph img{width:62%;aspect-ratio:auto;object-fit:contain;background:transparent;border-radius:0}
.th{width:40px;height:50px;object-fit:cover;border:1.5px solid var(--brindle);border-radius:8px;background:var(--bone);flex:none}
.th.sk{object-fit:contain;padding:4px;background:var(--bone)}
.th.lg{width:72px;height:90px}
.itemcell .th{width:44px;height:55px}
.tile.ship li .th{width:38px;height:48px}
.pcard{display:flex;gap:16px;align-items:flex-start}
.pcard .pc-body{flex:1;min-width:0}
.bcard .bmain{display:flex;gap:10px;align-items:flex-start}
.bcard .bmain .frame{width:84px;flex:none}
.bcard .binfo{flex:1;min-width:0}
.bcard .t{font-weight:700;font-size:15px;line-height:1.25}
.bcard .m1{font-size:13px;margin-top:3px;line-height:1.35}
.bcard .price{font-weight:700;margin-top:4px}
.tile.arrivals{grid-column:1/3}
.tile.earners{grid-column:3/5}
.pfs{display:grid;gap:14px;margin-top:12px}
.tile.arrivals .pfs{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile.earners .pfs{grid-template-columns:repeat(3,minmax(0,1fr))}
.pf{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;min-width:0}
.pf .pt{font-weight:700;font-size:15px;line-height:1.25}
.pf .pp{font-size:14px}
.pf .rk{position:absolute;left:-6px;top:-8px;z-index:2;width:30px;height:30px;border-radius:50%;background:var(--white);border:2px solid var(--brindle);font-family:var(--body);font-weight:700;letter-spacing:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.photobox{display:flex;gap:18px;align-items:center;background:var(--white);border:2px solid var(--brindle);border-radius:18px;padding:14px}
.frame.big{width:116px;flex:none;cursor:default}
.pb-text{min-width:0}.pb-text p{font-size:14px;margin:4px 0 8px}
.pb-btns{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--brindle);color:var(--bone);padding:10px 20px;border-radius:999px;z-index:60;font-size:15px;max-width:90vw;text-align:center}


/* ---------- listing kit ---------- */
dialog.kit{max-width:640px}
.kit-head{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.kit-head .frame{width:64px;cursor:default}
.kit-head h2{font-size:38px;margin:0}
.kit-head p{margin:0;font-size:14px}
.kfield{background:var(--white);border:1.5px solid var(--brindle);border-radius:14px;padding:8px 10px 6px;margin-bottom:8px}
.khead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px}
.khead b{font-size:14px}
.kfield textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:15px;min-height:0;resize:vertical;width:100%;line-height:1.4}
.kfield .btn{min-height:38px;padding:4px 18px;font-size:15px}
.kcount{font-size:13px;min-height:18px}
.kfield.cur{background:var(--sage)}
.kgroup{font-size:13px;margin:12px 0 6px;font-weight:700}
.kempty{font-size:13px;margin:6px 0 4px}
.tpl{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:8px}
.gmcard{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--brindle);border-radius:14px;padding:8px 10px;margin-bottom:8px;background:var(--white);cursor:pointer}
.gmcard input{margin-top:4px;flex:none}
.gmcard small{display:block;font-size:13px}
.gmcard .gm-new{font-weight:700}
.gmsteps li{margin-bottom:6px}
.syncstat{font-size:13px;margin-left:10px;opacity:.85}
.syncstat.bad{color:#B5543A;font-weight:700;cursor:pointer;text-decoration:underline}
.badge{display:inline-block;min-width:22px;height:22px;border-radius:999px;background:var(--brindle);color:var(--bone);font:700 13px/22px var(--body);padding:0 6px;margin-left:6px;vertical-align:middle;text-align:center;letter-spacing:0}
.badge.hot{background:#B5543A}
.badge[hidden]{display:none}
.tile.attn{margin-bottom:20px;background:#F3E4D6;border:2px solid #C49D7F}
.tile.attn ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.tile.attn li{display:flex;align-items:center;gap:12px;background:var(--white);border-radius:14px;padding:8px 14px;font-size:16px}
.tile.attn li .txt{flex:1;min-width:0}
.tile.attn li.hot{border:2px solid #B5543A}
.dl-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0}
.dl-row label{display:flex;gap:8px;align-items:center}
.photobox.dropping{background:var(--sage);outline:3px dashed var(--brindle);outline-offset:2px;border-radius:14px}
.bcard.dropping,tr.dropping,li.dropping{outline:3px dashed var(--plum);outline-offset:2px}
#dropHint{display:none;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--brindle);color:var(--bone);border-radius:999px;padding:10px 20px;font-weight:700;font-size:15px;max-width:92vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none}
body.filedrag #dropHint{display:block}
body.filedrag [data-panel="items"]{outline:3px dashed var(--plum);outline-offset:-6px;border-radius:18px}
.waitlist label small{font-size:13px}
.btnrow2{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#p_result .chip{cursor:pointer;font:inherit;font-size:13px;color:inherit}
.kprice{background:var(--bone);border:1.5px dashed var(--brindle);border-radius:14px;padding:8px 12px;margin-bottom:6px}
.kprice div{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kprice b{font-size:14px}
.kprice span{font-size:22px;font-weight:700}
.kprice small{display:block;font-size:13px}
.more{border:1.5px dashed var(--brindle);border-radius:14px;padding:8px 12px;background:var(--white)}
.more summary{cursor:pointer;font-weight:700;padding:2px 0}
.kstep{position:sticky;bottom:0;background:var(--bone);padding:10px 0 6px;border-top:1.5px solid var(--line);margin-top:10px;z-index:3}
.kstep .btn{width:100%;justify-content:center;min-height:50px;font-size:17px}
.kstep p{margin:6px 0 0;font-size:13px;text-align:center}
.kopen .btn.small{min-height:36px}
.kopen{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0 10px}
.kopen p{margin:0;font-size:13px}
.klink{border:1.5px dashed var(--brindle);border-radius:14px;padding:10px 12px;background:var(--white)}
.klink .row{display:flex;gap:8px;margin-top:6px}
.klink input{flex:1;min-width:0}
.kphoto{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
@media (max-width:700px){
  dialog.kit{width:100%;max-width:none;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:94vh}
  dialog.kit .dlg{padding:18px 16px 20px}
  .kit-head h2{font-size:32px}
}

@media (max-width:1100px){
  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile.ship{grid-column:1/3;grid-row:auto}.tile.chartt,.tile.today,.tile.arrivals,.tile.earners{grid-column:1/3}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid2.lower,.settings-grid{grid-template-columns:1fr}
}
@media (max-width:900px){
  :root{--topbar-h:56px}
  .login-body{grid-template-columns:1fr}
  .login-art img{max-height:40vh}
  .login-panel{padding:10px 8vw 40px;max-width:none}
  .apphead{padding:10px 16px 0}
  .nav{gap:14px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}
  .nav button{font-size:30px}
  .bento{grid-template-columns:1fr}
  .tile.ship,.tile.chartt,.tile.today,.tile.arrivals,.tile.earners{grid-column:auto}
  .tile.arrivals .pfs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .photobox{flex-direction:column;align-items:flex-start}
  .tile .todo{grid-template-columns:1fr}
  .hero h1.hello-text{font-size:72px}
  .board{height:clamp(420px,calc(100vh - 300px),680px)}
  .main{padding:18px 16px 30px}
  .form-grid{grid-template-columns:1fr}
  .hrow{grid-template-columns:1fr auto;grid-template-areas:'n v' 't t'}
  .hname{grid-area:n}.hval{grid-area:v}.htrack{grid-area:t}
  h1{font-size:46px}
  .hello-text{font-size:64px}
}
</style>
</head>

  /* ---------- helpers ---------- */
  function $(s,r){return (r||document).querySelector(s)}
  function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
  function money(n){n=num(n);return (n<0?'-':'')+'$'+Math.abs(n).toFixed(2)}
  function pad(n){return (n<10?'0':'')+n}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function isoDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function today(){return isoDate(new Date())}
  function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return isoDate(d)}
  function fmtDate(iso){if(!iso)return '';var p=iso.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
  function thisMonth(iso){return !!iso&&iso.slice(0,7)===today().slice(0,7)}
  function daysBetween(iso){var p=iso.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return Math.max(0,Math.round((new Date()-d)/86400000))}
  function platName(k){return k==='direct'?'Direct':(PLAT[k]?PLAT[k].name:esc(k))}
  function plural(n,w){return n+' '+w+(n===1?'':'s')}

  function blank(){return {items:[],notes:[],tasks:[],templates:[],gmail:{clientId:'',query:'',done:[],auto:false},money:{wallet:{},pending:{},direct:0,adjust:{}},settings:{name:'',fees:{},hold:{}}}}
  function normalize(d){
    var b=blank(); d=d||{};
    b.items=Array.isArray(d.items)?d.items:[]; b.notes=Array.isArray(d.notes)?d.notes:[]; b.tasks=Array.isArray(d.tasks)?d.tasks:[];
    if(d.money){b.money.wallet=d.money.wallet||{};b.money.pending=d.money.pending||{};b.money.direct=num(d.money.direct);b.money.adjust=d.money.adjust||{}}

    if(d.gmail){b.gmail.clientId=d.gmail.clientId||'';b.gmail.query=d.gmail.query||'';b.gmail.done=Array.isArray(d.gmail.done)?d.gmail.done:[];b.gmail.auto=!!d.gmail.auto}
    b.templates=(Array.isArray(d.templates)&&d.templates.length)?d.templates:defaultTemplates();

  var MOCKPHOTOS=/*__MOCKPHOTOS__*/{};
  var PH={}, idbRef=null, toastTimer=null;
  function toast(msg){var t=$('#toast');if(!t)return;t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},4500)}
  function idb(){return new Promise(function(res,rej){
    if(idbRef)return res(idbRef); if(!window.indexedDB)return rej(new Error('no idb'));
    var r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=function(){r.result.createObjectStore('photos')};
    r.onsuccess=function(){idbRef=r.result;res(idbRef)}; r.onerror=function(){rej(r.error)};
  })}
  function tx(mode,fn){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction('photos',mode),out=fn(t.objectStore('photos'));t.oncomplete=function(){res(out&&out.result)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})})}
  function photoPutLocal(id,blob){return tx('readwrite',function(s){return s.put(blob,id)})}
  function photoDelLocal(id){return tx('readwrite',function(s){return s.delete(id)})}
  function photoGetLocal(id){return tx('readonly',function(s){return s.get(id)})}
  function photoPut(id,blob){return photoPutLocal(id,blob).then(function(r){if(CLOUD.on&&CLOUD.uid){var it=findItem(id);if(it)delete it.photoCloud;cloudPhotoUp(id,blob)}return r})}
  function photoDel(id){return photoDelLocal(id).then(function(r){cloudPhotoDel(id);return r})}
  function photosClear(){Object.keys(PH).forEach(clearPhoto);return tx('readwrite',function(s){return s.clear()}).catch(function(){})}
  function photoAll(){return idb().then(function(d){return new Promise(function(res,rej){var out={},c=d.transaction('photos','readonly').objectStore('photos').openCursor();c.onsuccess=function(){var cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=function(){rej(c.error)}})})}
  function setPhoto(id,blob){clearPhoto(id);PH[id]=URL.createObjectURL(blob)}
  function clearPhoto(id){if(PH[id]){try{URL.revokeObjectURL(PH[id])}catch(e){}delete PH[id]}}

  function checkLink(key,val){
    val=(val||'').trim(); if(!val)return {ok:true,warn:''};
    var u; try{u=new URL(val)}catch(e){return {ok:false,msg:'That doesn’t look like a web link. It should start with https://'}}
    if(u.protocol!=='http:'&&u.protocol!=='https:')return {ok:false,msg:'That doesn’t look like a web link. It should start with https://'};
    var host=u.hostname.toLowerCase(), dom=PLAT[key].domain;
    if(!(host===dom||host.slice(-(dom.length+1))==='.'+dom))return {ok:true,warn:'Heads up: this link isn’t on '+dom+'. It will still be saved.'};
    return {ok:true,warn:''};
  }

  /* ================= MONEY CHARTS ================= */
  function niceCeil(v){if(!(v>0))return 10;var p=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)),n=v/p,m=n<=1?1:(n<=2?2:(n<=2.5?2.5:(n<=5?5:10)));return m*p}
  function monthKeys(n){var out=[],now=new Date();for(var i=n-1;i>=0;i--){var x=new Date(now.getFullYear(),now.getMonth()-i,1);out.push(x.getFullYear()+'-'+pad(x.getMonth()+1))}return out}
  function monthLabel(key){var p=key.split('-'),d=new Date(+p[0],+p[1]-1,1),m=d.toLocaleDateString('en-US',{month:'short'});return p[1]==='01'?m+' ’'+p[0].slice(2):m}
  function short$(n){var a=Math.abs(n),s=a>=1000?'$'+(a/1000).toFixed(a>=10000?0:1).replace(/\.0$/,'')+'k':'$'+Math.round(a);return (n<0?'-':'')+s}
  function chartEmpty(msg){return '<p class="chart-empty">'+msg+'</p>'}

  function chartMonthly(anim){
    var keys=monthKeys(6),rows=keys.map(function(k){return {k:k,sales:0,profit:0,n:0}});
    state.items.forEach(function(i){
      if(!i.sale||!i.sale.date)return;
      var row=rows.filter(function(r){return r.k===i.sale.date.slice(0,7)})[0];
      if(row){row.sales+=num(i.sale.price);row.profit+=profitOf(i);row.n++}
    });
    if(!rows.some(function(r){return r.n>0}))return chartEmpty('No sales in the last 6 months yet. Mark an item as sold and this chart fills in.');
    var maxV=Math.max.apply(null,rows.map(function(r){return Math.max(r.sales,r.profit,0)}));
    var minV=Math.min.apply(null,rows.map(function(r){return Math.min(r.profit,0)}));
    var top=niceCeil(maxV),bottom=minV<0?-niceCeil(-minV):0,range=top-bottom;
    function pct(v){return (v-bottom)/range*100}
    var zero=pct(0),ticks=[];
    for(var t=0;t<=4;t++)ticks.push(top*t/4);
    if(bottom<0)ticks.unshift(bottom);
    var aria='Monthly sales and profit, last 6 months. '+rows.map(function(r){return monthLabel(r.k)+': sales '+money(r.sales)+', profit '+money(r.profit)}).join('. ');
    var h='<div class="chartscroll"><div class="c1-wrap'+(anim?' anim':'')+'" role="img" aria-label="'+esc(aria)+'"><div class="c1-y">'+

  function chartDollar(sold,anim){
    var rev=0,cost=0,fees=0,ship=0;
    sold.forEach(function(i){rev+=num(i.sale.price);cost+=num(i.cost);fees+=feeFor(i.sale.platform,i.sale.price);ship+=num(i.sale.shipCost)});
    var profit=rev-cost-fees-ship;
    if(!sold.length||(rev<=0&&cost+fees+ship<=0))return chartEmpty('No sales in this period yet. Mark an item as sold and this bar fills in.');
    var segs=[{n:'What I paid',v:cost,c:'var(--lilac)'},{n:'Fees',v:fees,c:'var(--fawn)'},{n:'Shipping',v:ship,c:'var(--plum)'}];
    var loss=profit<0;
    if(!loss)segs.push({n:'Profit',v:profit,c:'var(--olive)'});
    var total=segs.reduce(function(a,s){return a+s.v},0)||1, base=rev>0?rev:total;
    var note=loss?'You spent '+money(-profit)+' more than you earned in this period.':(rev>0?'You keep about '+Math.round(profit/rev*100)+'¢ of every $1 you sell.':'');
    var aria='Where each dollar goes. '+segs.map(function(s){return s.n+' '+money(s.v)}).join(', ');
    var h=(note?'<p class="c2-note">'+esc(note)+'</p>':'')+'<div class="'+(anim?'anim':'')+'" role="img" aria-label="'+esc(aria)+'"><div class="c2-pct">'+
      segs.map(function(s){var w=s.v/total*100;return '<span style="flex:0 0 '+w+'%">'+(w>=9?Math.round(s.v/base*100)+'%':'')+'</span>'}).join('')+'</div><div class="c2-bar">'+
      segs.map(function(s){return '<div class="c2-seg" style="flex:0 0 '+(s.v/total*100)+'%;background:'+s.c+'" title="'+esc(s.n+' '+money(s.v))+'"></div>'}).join('')+'</div></div>'+
      '<div class="c2-legend">'+segs.map(function(s){return '<div><i class="sw" style="background:'+s.c+'"></i>'+esc(s.n)+'<b>'+money(s.v)+' · '+Math.round(s.v/base*100)+'%</b></div>'}).join('')+'</div>';
    return h;
  }

  function hbars(rows,anim,colorFor){
    if(!rows.length)return chartEmpty('Nothing to show yet.');
    var maxAbs=Math.max.apply(null,rows.map(function(r){return Math.abs(r.profit)}))||1;
    return '<div class="'+(anim?'anim':'')+'">'+rows.map(function(r,idx){
      var w=Math.max(2,Math.abs(r.profit)/maxAbs*100);
      return '<div class="hrow"><div class="hname">'+esc(r.name)+'<small>'+plural(r.n,'item')+' sold</small></div><div class="htrack"><div class="hbar'+(r.profit<0?' loss':'')+'" style="width:'+w+'%;background-color:'+colorFor(r)+';--d:'+(idx*0.1).toFixed(2)+'s" title="'+esc(r.name+': '+money(r.profit))+'"></div></div><div class="hval"><b>'+money(r.profit)+'</b><small>'+money(r.profit/r.n)+' per item</small></div></div>';
    }).join('')+'</div>';

  function groupProfit(sold,keyFn,nameFn){

    return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return b.profit-a.profit});
  }

  function animateCounts(root,anim){
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    $all('[data-count]',root).forEach(function(el){
      var target=num(el.getAttribute('data-count')),fmt=el.getAttribute('data-fmt'),f=function(v){return fmt==='int'?String(Math.round(v)):(fmt==='d0'?'$'+Math.round(v):money(v))},final=f(target);
      if(!anim||reduce||!window.requestAnimationFrame){el.textContent=final;return}
      var start=null,dur=800;el.textContent=f(0);
      function step(ts){if(start===null)start=ts;var k=Math.min(1,(ts-start)/dur),e=1-Math.pow(1-k,3);el.textContent=f(target*e);if(k<1)requestAnimationFrame(step);else el.textContent=final}
      requestAnimationFrame(step);
    });
  }

  }
  function sb(method,path,o){
    o=o||{}; var h={apikey:CLOUD.key}, k;
    if(o.token)h.Authorization='Bearer '+o.token;
    if(o.json!==undefined)h['Content-Type']='application/json';
    if(o.headers)for(k in o.headers)h[k]=o.headers[k];
    return fetch(CLOUD.url+path,{method:method,headers:h,body:o.json!==undefined?JSON.stringify(o.json):o.body});
  }
  function expiredErr(){var e=new Error('expired');e.expired=true;return e}
  function setSession(j){
    CLOUD.sess={access_token:j.access_token,refresh_token:j.refresh_token||(CLOUD.sess&&CLOUD.sess.refresh_token)||'',expires_at:Date.now()+((+j.expires_in||3600)*1000)};
    if(j.user){CLOUD.uid=j.user.id;CLOUD.email=j.user.email||CLOUD.email}
    sessSave();
  }
  function cloudRefresh(){
    if(CLOUD.refreshing)return CLOUD.refreshing;
    var s=CLOUD.sess; if(!s||!s.refresh_token)return Promise.reject(expiredErr());
    CLOUD.refreshing=sb('POST','/auth/v1/token?grant_type=refresh_token',{json:{refresh_token:s.refresh_token}}).then(function(r){
      return r.json().catch(function(){return {}}).then(function(j){
        if(!r.ok||!j.access_token){if(r.status>=500)throw new Error('server');throw expiredErr()}
        setSession(j);return CLOUD.sess.access_token});
    }).then(function(t){CLOUD.refreshing=null;return t},function(e){CLOUD.refreshing=null;throw e});
    return CLOUD.refreshing;
  }
  function cloudToken(){var s=CLOUD.sess;if(!s)return Promise.reject(expiredErr());return (s.expires_at-Date.now()<60000)?cloudRefresh():Promise.resolve(s.access_token)}
  function sbAuthed(method,path,o){
    o=o||{};
    return cloudToken().then(function(t){o.token=t;return sb(method,path,o)}).then(function(r){
      if(r.status!==401)return r;
      return cloudRefresh().then(function(t){o.token=t;return sb(method,path,o)});
    });
  }
  function cloudFetchRemote(){
    return sbAuthed('GET','/rest/v1/rc_state?select=data,version,updated_at&user_id=eq.'+CLOUD.uid).then(function(r){
      if(!r.ok)return r.text().then(function(t){throw new Error('http '+r.status+(t?' '+t.slice(0,100):''))});
      return r.json().then(function(rows){return rows&&rows.length?rows[0]:null});
    });
  }
  function verSet(v){CLOUD.ver=v;store.set('rc_ver_'+CLOUD.uid,String(v))}
  function dirtySet(f){CLOUD.dirty=f;if(f)store.set('rc_dirty_'+CLOUD.uid,'1');else store.del('rc_dirty_'+CLOUD.uid)}
  function cloudDirty(){
    if(!CLOUD.on||!CLOUD.uid||CLOUD.applying)return;
    dirtySet(true); setSync('pending','Saving…'); clearTimeout(syncT); syncT=setTimeout(cloudPush,1500);
  }
  function cloudFail(e){
    if(e&&e.expired){cloudLogout(true,'Your session ended. Please log in again.');return}
    var off=(e instanceof TypeError)||!navigator.onLine;
    setSync('bad',off?'Offline. Will sync when you’re back.':'Couldn’t sync. Tap to retry.');
    clearTimeout(CLOUD.retry); CLOUD.retry=setTimeout(function(){if(CLOUD.dirty)cloudPush();else cloudPull()},30000);
  }
  function applyRemote(row){
    CLOUD.applying=true;
    try{state=normalize(row.data);store.set(DATA_KEY,JSON.stringify(state))}finally{CLOUD.applying=false}
    verSet(row.version); dirtySet(false); CLOUD.lastSync=Date.now(); render();
  }
  function cloudConflict(){
    return cloudFetchRemote().then(function(row){
      if(!row){verSet(0);CLOUD.again=true;return}
      if(CLOUD.dirty){try{store.set('rc_conflict_'+CLOUD.uid,JSON.stringify(state))}catch(e){}}
      applyRemote(row); setSync('ok','Saved ✓');
      toast('Your other device had newer changes, so I loaded those. A copy of what was on this device is in Settings.');
      return cloudPhotosSync();
    });
  }
  function cloudPush(){
    if(!CLOUD.on||!CLOUD.uid)return Promise.resolve();
    if(CLOUD.busy){CLOUD.again=true;return Promise.resolve()}
    CLOUD.busy=true; clearTimeout(syncT); setSync('pending','Saving…');
    var snap=JSON.stringify(state), ver=CLOUD.ver, first=(ver===0), body=JSON.parse(snap), req;
    if(first)req=sbAuthed('POST','/rest/v1/rc_state',{json:{user_id:CLOUD.uid,data:body,version:1},headers:{Prefer:'return=representation'}});
    else req=sbAuthed('PATCH','/rest/v1/rc_state?user_id=eq.'+CLOUD.uid+'&version=eq.'+ver,{json:{data:body,version:ver+1,updated_at:new Date().toISOString()},headers:{Prefer:'return=representation'}});
    return req.then(function(r){
      if(r.status===409)return cloudConflict();
      if(!r.ok)return r.text().then(function(t){throw new Error('http '+r.status+(t?' '+t.slice(0,100):''))});
      return r.json().then(function(rows){
        if(!rows||!rows.length)return cloudConflict();
        verSet(rows[0].version);
        if(JSON.stringify(state)===snap)dirtySet(false);else CLOUD.again=true;
        CLOUD.lastSync=Date.now(); setSync('ok','Saved ✓'); return cloudPhotosSync();
      });
    }).catch(cloudFail).then(function(){CLOUD.busy=false;if(CLOUD.again){CLOUD.again=false;cloudDirty()}});
  }
  function cloudPull(){
    if(!CLOUD.on||!CLOUD.uid||CLOUD.busy)return Promise.resolve();
    return cloudFetchRemote().then(function(row){
      if(!row)return cloudNewAccount();
      if(row.version>CLOUD.ver){if(CLOUD.dirty)return cloudConflict();applyRemote(row);setSync('ok','Saved ✓');return cloudPhotosSync()}
      if(CLOUD.dirty)return cloudPush();
      CLOUD.lastSync=CLOUD.lastSync||Date.now(); setSync('ok','Saved ✓'); return cloudPhotosSync();
    }).catch(cloudFail);
  }
  function legacyPhotosIn(){
    return new Promise(function(res){
      if(!window.indexedDB)return res();
      var r=indexedDB.open('raylosclo',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('photos')};
      r.onerror=function(){res()};
      r.onsuccess=function(){
        var d=r.result,out={},c;
        try{c=d.transaction('photos','readonly').objectStore('photos').openCursor()}catch(e){d.close();return res()}
        c.onsuccess=function(){var cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else{d.close();Promise.all(Object.keys(out).map(function(k){setPhoto(k,out[k]);return photoPutLocal(k,out[k]).catch(function(){})})).then(function(){res()},function(){res()})}};
        c.onerror=function(){d.close();res()};
      };
    });
  }
  function cloudNewAccount(){
    var legacy=null; try{legacy=JSON.parse(window.localStorage.getItem('rc_data')||'null')}catch(e){}
    var has=legacy&&Array.isArray(legacy.items)&&legacy.items.length>0&&!state.items.length;
    if(has&&!store.get('rc_legacy_no')){
      if(window.confirm('I found '+plural(legacy.items.length,'item')+' saved in this browser from before accounts. Move them into your new account?')){
        state=normalize(legacy); store.set(DATA_KEY,JSON.stringify(state));
        return legacyPhotosIn().then(function(){render();verSet(0);return cloudPush()});
      }
      store.set('rc_legacy_no','1');
    }
    store.set(DATA_KEY,JSON.stringify(state)); verSet(0); return cloudPush();
  }
  /* ---- photos in private cloud storage ---- */
  function cloudPhotoPath(id){return '/storage/v1/object/photos/'+CLOUD.uid+'/'+id+'.jpg'}
  function cloudPhotoUp(id,blob){
    if(!CLOUD.on||!CLOUD.uid)return Promise.resolve();
    CLOUD.upping[id]=1;
    return sbAuthed('POST',cloudPhotoPath(id),{body:blob,headers:{'Content-Type':'image/jpeg','x-upsert':'true'}}).then(function(r){
      if(!r.ok)throw new Error('photo '+r.status);
      var it=findItem(id); if(it&&it.photoCloud!==true){it.photoCloud=true;save()}
    }).catch(function(e){cloudFail(e)}).then(function(){delete CLOUD.upping[id]});
  }
  function cloudPhotoDel(id){
    if(!CLOUD.on||!CLOUD.uid)return Promise.resolve();
    var it=findItem(id); if(it&&it.photoCloud!==false){it.photoCloud=false;save()}
    return sbAuthed('DELETE',cloudPhotoPath(id)).catch(function(){});
  }
  function cloudPhotoDown(id){
    return sbAuthed('GET','/storage/v1/object/authenticated/photos/'+CLOUD.uid+'/'+id+'.jpg').then(function(r){
      if(r.status===404||r.status===400){var it=findItem(id);if(it&&it.photoCloud===true){it.photoCloud=false;save()}return false}
      if(!r.ok)throw new Error('photo '+r.status);
      return r.blob().then(function(b){setPhoto(id,b);return photoPutLocal(id,b).catch(function(){}).then(function(){return true})});
    });
  }
  function cloudPhotosSync(){
    if(!CLOUD.on||!CLOUD.uid)return Promise.resolve();
    var jobs=[];
    state.items.forEach(function(it){
      var local=!!PH[it.id];
      if(it.photoCloud===true&&!local)jobs.push(cloudPhotoDown(it.id));
      else if(it.photoCloud===undefined&&local&&!CLOUD.upping[it.id])jobs.push(photoGetLocal(it.id).then(function(b){return b?cloudPhotoUp(it.id,b):null}));
      else if(it.photoCloud===false&&local&&!CLOUD.upping[it.id]){clearPhoto(it.id);jobs.push(photoDelLocal(it.id).catch(function(){}))}
    });
    if(!jobs.length)return Promise.resolve();
    return Promise.all(jobs.map(function(p){return Promise.resolve(p).catch(function(){})})).then(function(){render()});
  }
  function cloudPhotosWipe(){
    if(!CLOUD.on||!CLOUD.uid)return;
    state.items.forEach(function(it){if(it.photoCloud===true)sbAuthed('DELETE',cloudPhotoPath(it.id)).catch(function(){})});
  }
  /* ---- log in / create account / forgot password ---- */
  function loginSay(t,good){var e=$('#loginError');if(!e)return;e.textContent=t||'';e.style.color=good?'var(--brindle)':''}
  function authMsg(j,fallback){
    var m=(j&&(j.error_description||j.msg||j.message||j.error))||'';
    if(/invalid login credentials/i.test(m))return 'That email and password don’t match. Check them, or tap Forgot password.';
    if(/email not confirmed/i.test(m))return 'Check your email and tap the confirmation link first. Then log in.';
    if(/already registered|already been registered/i.test(m))return 'That email already has an account. Tap Log in instead.';
    if(/password should|weak password|at least/i.test(m))return 'Choose a longer password (at least 8 characters).';
    if(/rate limit|too many|security purposes/i.test(m))return 'Too many tries. Wait a minute and try again.';
    if(/signups? (not allowed|disabled)|signup is disabled/i.test(m))return 'New accounts are switched off for this site.';
    return fallback+(m?' ('+m+')':'');
  }
  function netErr(e){loginSay((e instanceof TypeError)?'I couldn’t reach the server. Check your internet and try again.':'Something went wrong. Try again.')}
  function setLoginMode(m){
    CLOUD.mode=m;
    var sub=$('.login-panel .sub'), go=$('#loginForm .go'), foot=$('.login-foot'), su=$('#signupBtn'), pw=$('#password'), ef=$('#email').closest('.field'), fg=$('.row-links');
    ef.style.display=(m==='newpw')?'none':''; fg.style.display=(m==='login')?'':'none';
    $('label[for=password]').textContent=(m==='newpw')?'New password':'Password';
    pw.setAttribute('autocomplete',m==='login'?'current-password':'new-password');
    sub.textContent={login:'Log in to see your closet.',signup:'Create your account. It takes a minute.',newpw:'Choose a new password.'}[m];
    go.innerHTML={login:'Log in &rarr;',signup:'Create account &rarr;',newpw:'Save new password &rarr;'}[m];
    if(foot){foot.style.display=(m==='newpw')?'none':'';if(foot.firstChild)foot.firstChild.textContent=(m==='signup')?'Already have an account? ':'New here? ';su.textContent=(m==='signup')?'Log in':'Create an account'}
    loginSay('');
  }
  function cloudLoginUI(){
    var n=$('.login-panel .note'); if(n)n.textContent='Your closet is saved to your account, so it’s the same on your phone and your laptop.';
    setLoginMode('login');
  }
  function cloudAuthSubmit(){
    if(CLOUD.blocked){loginSay(CLOUD.blocked);return}
    var email=$('#email').value.trim(), pw=$('#password').value, btn=$('#loginForm .go'), m=CLOUD.mode;
    if(m!=='newpw'&&(!email||email.indexOf('@')<1||email.indexOf('.',email.indexOf('@'))<0)){loginSay('Enter the email address you use for this site.');$('#email').focus();return}
    if(!pw){loginSay('Enter your password.');$('#password').focus();return}
    if((m==='signup'||m==='newpw')&&pw.length<8){loginSay('Choose a password with at least 8 characters.');$('#password').focus();return}
    btn.disabled=true; loginSay('One moment…',true);
    var done=function(){btn.disabled=false};
    if(m==='newpw'){
      sb('PUT','/auth/v1/user',{token:CLOUD.sess.access_token,json:{password:pw}}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){
        if(!r.ok){loginSay(authMsg(j,'Couldn’t save the new password.'));return}
        setLoginMode('login'); cloudEnter();
      })}).catch(netErr).then(done); return;
    }
    if(m==='signup'){
      sb('POST','/auth/v1/signup',{json:{email:email,password:pw}}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){
        if(!r.ok){loginSay(authMsg(j,'Couldn’t create the account.'));return}
        if(j.access_token){setSession(j);if(!CLOUD.email)CLOUD.email=email;cloudEnter();return}
        setLoginMode('login'); $('#email').value=email; loginSay('Account created. Check your email for a confirmation link, tap it, then log in here.',true);
      })}).catch(netErr).then(done); return;
    }
    sb('POST','/auth/v1/token?grant_type=password',{json:{email:email,password:pw}}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok||!j.access_token){loginSay(authMsg(j,'Couldn’t log in.'));return}
      setSession(j); if(!CLOUD.email)CLOUD.email=email; cloudEnter();
    })}).catch(netErr).then(done);
  }
  function cloudForgot(){
    if(CLOUD.blocked){loginSay(CLOUD.blocked);return}
    var email=$('#email').value.trim(); if(!email||email.indexOf('@')<1){loginSay('Type your email above first, then tap Forgot password.');$('#email').focus();return}
    loginSay('Sending…',true);
    sb('POST','/auth/v1/recover',{json:{email:email}}).then(function(r){
      if(r.ok)loginSay('If that email has an account, a reset link is on its way. Tap it, then choose a new password.',true);
      else r.json().catch(function(){return {}}).then(function(j){loginSay(authMsg(j,'Couldn’t send the reset email.'))});
    }).catch(netErr);
  }
  function cloudEnter(){
    var uid=CLOUD.uid;
    DATA_KEY='rc_cloud_'+uid; IDB_NAME='raylosclo_u_'+uid;
    if(idbRef){try{idbRef.close()}catch(e){}idbRef=null}
    Object.keys(PH).forEach(clearPhoto);
    state=load(); CLOUD.ver=+store.get('rc_ver_'+uid)||0; CLOUD.dirty=store.get('rc_dirty_'+uid)==='1';
    store.set('rc_user',CLOUD.email||'account');
    loginEl.hidden=true; appEl.hidden=false; $('#password').value='';
    setSync('pending','Syncing…'); show(currentView());
    photoAll().then(function(map){Object.keys(map).forEach(function(k){setPhoto(k,map[k])});render()}).catch(function(){}).then(function(){return cloudPull()});
  }
  function cloudLogout(forced,msg){
    function finish(){
      var tok=CLOUD.sess&&CLOUD.sess.access_token, uid=CLOUD.uid;
      if(tok&&!forced)sb('POST','/auth/v1/logout',{token:tok}).catch(function(){});
      clearTimeout(syncT);clearTimeout(CLOUD.retry);
      CLOUD.sess=null; sessSave();
      if(idbRef){try{idbRef.close()}catch(e){}idbRef=null}
      if(!forced){store.del('rc_cloud_'+uid);store.del('rc_ver_'+uid);store.del('rc_dirty_'+uid);try{indexedDB.deleteDatabase('raylosclo_u_'+uid)}catch(e){}}
      Object.keys(PH).forEach(clearPhoto);
      CLOUD.uid='';CLOUD.email='';CLOUD.ver=0;CLOUD.dirty=false;CLOUD.busy=false;
      DATA_KEY='rc_data'; IDB_NAME='raylosclo'; state=blank(); store.del('rc_user');
      appEl.hidden=true; loginEl.hidden=false; $('#password').value=''; setSync('',''); document.title='Raylos’Clo';
      if(location.hash)history.replaceState(null,'',location.pathname+location.search);
      setLoginMode('login'); if(msg)loginSay(msg,!forced); $('#email').focus();
    }
    if(!forced&&CLOUD.dirty){cloudPush().then(function(){if(CLOUD.dirty&&!window.confirm('Some changes haven’t been saved to your account yet. Log out anyway and lose them?'))return;finish()})}
    else finish();
  }
  function hashSession(){
    var h=location.hash||''; if(h.indexOf('access_token=')<0&&h.indexOf('error_description=')<0)return null;
    var p={}; h.replace(/^#/,'').split('&').forEach(function(x){var kv=x.split('=');if(kv[0])p[decodeURIComponent(kv[0])]=decodeURIComponent((kv.slice(1).join('=')||'').replace(/\+/g,' '))});
    history.replaceState(null,'',location.pathname+location.search);
    return p;
  }
  function accountCardHtml(){
    if(!CLOUD.on||!CLOUD.uid)return '';
    var conflict=!!store.get('rc_conflict_'+CLOUD.uid);
    var line=CLOUD.dirty?'Changes are waiting to be saved.':(CLOUD.lastSync?'Last saved '+new Date(CLOUD.lastSync).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+'.':'Up to date.');
    return '<div class="card" style="--accent:var(--sage)"><h2>Your account</h2><p style="margin:0 0 6px">Signed in as <b>'+esc(CLOUD.email)+'</b>. Your closet is saved to your account, so it’s the same on every device you log in on.</p><p style="margin:0 0 10px;font-size:15px">'+esc(line)+'</p><div class="btnrow2"><button type="button" class="btn" data-action="cloud-sync">Sync now</button>'+(conflict?'<button type="button" class="btn secondary" data-action="cloud-conflict-dl">Download my copy from before the last sync clash</button>':'')+'</div></div>';
  }
  function cloudBoot(){
    function localBoot(){var saved=store.get('rc_user');if(saved)enter(saved)}
    fetch('config.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}).then(function(cfg){
      var url=cfg?String(cfg.supabaseUrl||'').trim().replace(/\/+$/,''):'', key=cfg?String(cfg.supabaseKey||'').trim():'';
      if(!url||!key||!/^https:\/\//.test(url)||/YOUR|example/i.test(url+key)){localBoot();return}
      CLOUD.on=true; CLOUD.url=url; CLOUD.key=key;
      cloudLoginUI();
      if(secretKey(key)){CLOUD.blocked='The site’s config.json has the SECRET key in it. Replace it with the publishable (or anon) key, then reload.';loginSay(CLOUD.blocked);return}
      var hs=hashSession();
      if(hs&&hs.access_token){
        CLOUD.sess={access_token:hs.access_token,refresh_token:hs.refresh_token||'',expires_at:Date.now()+((+hs.expires_in||3600)*1000)};
        sb('GET','/auth/v1/user',{token:hs.access_token}).then(function(r){if(!r.ok)throw new Error('bad');return r.json()}).then(function(u){
          CLOUD.uid=u.id;CLOUD.email=u.email||'';sessSave();
          if(hs.type==='recovery'){setLoginMode('newpw');loginSay('Choose a new password for '+CLOUD.email+'.',true)}else cloudEnter();
        }).catch(function(){CLOUD.sess=null;loginSay('That link didn’t work. It may have expired. Ask for a new one.')});
        return;
      }
      if(hs&&hs.error_description){loginSay(hs.error_description)}
      var sv=sessRead();
      if(sv&&sv.sess&&sv.uid){CLOUD.sess=sv.sess;CLOUD.uid=sv.uid;CLOUD.email=sv.email||'';cloudEnter()}
    });
  }
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&CLOUD.on&&CLOUD.uid&&!appEl.hidden&&!document.querySelector('dialog[open]'))cloudPull()});
  window.addEventListener('online',function(){if(CLOUD.on&&CLOUD.uid)(CLOUD.dirty?cloudPush():cloudPull())});
  setInterval(function(){if(!document.hidden&&CLOUD.on&&CLOUD.uid&&!appEl.hidden&&!CLOUD.busy&&!document.querySelector('dialog[open]'))cloudPull()},60000);
  document.addEventListener('click',function(e){if(e.target&&e.target.id==='syncStat'&&e.target.getAttribute('data-k')==='bad'){CLOUD.dirty?cloudPush():cloudPull()}});

  /* ---------- auth (demo only) ---------- */
  function enter(email){
    store.set('rc_user',email);
    loginEl.hidden=true; appEl.hidden=false;
    show(currentView());
  }
  function leave(){
    if(CLOUD.on){cloudLogout(false);return}
    store.del('rc_user');
    appEl.hidden=true; loginEl.hidden=false;
    $('#password').value=''; $('#loginError').textContent='';
    document.title='Raylos’Clo';
    if(location.hash)history.replaceState(null,'',location.pathname+location.search);
    $('#email').focus();
  }
  $('#loginForm').addEventListener('submit',function(e){
    e.preventDefault();
    if(CLOUD.on){cloudAuthSubmit();return}
    var email=$('#email').value.trim(), pw=$('#password').value, err=$('#loginError');
    if(!email){err.textContent='Enter your email address.';$('#email').focus();return}
    if(email.indexOf('@')<1||email.indexOf('.',email.indexOf('@'))<0){err.textContent='That email doesn’t look right. Check for a missing @ or dot.';$('#email').focus();return}
    if(!pw){err.textContent='Enter your password.';$('#password').focus();return}
    err.textContent='';enter(email);
  });
  $('#demoBtn').addEventListener('click',function(){
    $('#email').value='demo@raylosclo.com';$('#password').value='demo-password';$('#loginError').textContent='';
    if($('#loginForm').requestSubmit)$('#loginForm').requestSubmit();else enter('demo@raylosclo.com');
  });
  $('#forgotBtn').addEventListener('click',function(){if(CLOUD.on){cloudForgot();return}$('#loginError').textContent='Password reset isn’t part of the demo yet.'});
  $('#signupBtn').addEventListener('click',function(){if(CLOUD.on){setLoginMode(CLOUD.mode==='signup'?'login':'signup');return}$('#loginError').textContent='Creating accounts isn’t part of the demo yet.'});
  $('#logoutBtn').addEventListener('click',leave);
  $all('.nav button').forEach(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-view'))})});
  window.addEventListener('hashchange',function(){if(!appEl.hidden)show(currentView())});

  /* ---------- start ---------- */
  if(MOCK){$all('.topbar,.ah-left').forEach(function(t){var b=document.createElement('span');b.className='mockbadge';b.textContent='Mock version · fake data';t.insertBefore(b,t.firstChild)});var n=$('.login-panel .note');if(n)n.textContent='Mock version: any email and password will work.'}
  photoAll().then(function(map){if(CLOUD.on)return;Object.keys(map).forEach(function(k){setPhoto(k,map[k])});if(!appEl.hidden)render()}).catch(function(){});
  if(MOCK)enter('ray@raylosclo.com');else cloudBoot();
})();
</script>
